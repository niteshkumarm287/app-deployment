apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: hello
  name: hello-role
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hello-rolebinding
  namespace: hello
subjects:
- kind: ServiceAccount
  name: hello-ksa
  namespace: hello
roleRef:
  kind: Role
  name: hello-role
  apiGroup: rbac.authorization.k8s.io